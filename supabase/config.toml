project_id = "your-project-ref"

# Stripe-related functions skip JWT verification because Stripe authenticates
# via stripe-signature header instead.
[functions.stripe-webhook]
verify_jwt = false

[functions.check-stripe-purchase]
verify_jwt = false

[functions.sync-stripe-subscribers]
verify_jwt = false

[functions.customer-portal]
verify_jwt = false

[functions.cancel-subscription]
verify_jwt = false

# AI chat verifies the caller's Supabase JWT (default behavior).
[functions.ai-chat]
verify_jwt = true
